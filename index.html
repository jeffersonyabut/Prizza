<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizza</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="home-container">
      <div class="home-body">
        <h1>Frontend Enthusiast</h1>
        <div class="prof-desc">
          <img
            style="margin-left: 42px"
            class="prof-pic"
            src="1x1.png"
            alt="prof-pic"
            width="240px"
            height="240px"
          />
          <div>
            <h2
              style="
                font-family: Inter;
                color: var(--primary);
                font-size: 32px;
                z-index: 10;
                position: relative;
              "
            >
              Jefferson Yabut
            </h2>
            <div class="p-info">
              <p style="position: relative; z-index: 1">
                Currently exploring UI/UX and frontend development.
              </p>
              <p class="u-line"></p>
            </div>
            <button class="dl_button" onclick="alert('On development')" ;>
              download cv
              <img
                src="/prizza/public/d-Vector.svg"
                alt=""
                height="20"
                width="20"
              />
            </button>
          </div>
        </div>
      </div>
      <img src="/prizza/public/plane-det.svg" class="plane-det" />
      <img
        src="/prizza/public/tri-detail.svg"
        class="tri-det"
        style="position: absolute; bottom: 355px; right: 10vw; z-index: 0"
      />
    </div>

    <div class="project-container" id="project-container">
      <div
        class="card"
        data-title="POS + Inventory"
        data-tech="C#, .NET MAUI, SQLite"
      ></div>
      <div
        class="card"
        data-title="Portfolio"
        data-tech="Html, Css, JavaScript"
      ></div>
      <div
        class="card"
        data-title="Multiplaycation"
        data-tech="Html, Css, JavaScript"
      ></div>
      <div
        class="card"
        data-title="Filmstack"
        data-tech="React, Tailwind"
      ></div>
      <div
        class="card"
        data-title="Anonmsg"
        data-tech="Html, Css, JavaScript"
      ></div>
      <div
        class="card"
        data-title="Prizzabooth"
        data-tech="React, Tailwind"
      ></div>

      <div class="card" data-title="AI Agent" data-tech="n8n "></div>
      <img
        src="/prizza/public/hexa-det.svg"
        style="position: absolute; top: 15px; right: 3vw"
        class="hexa-det"
      />

      <img
        src="/prizza/public/tri-detail.svg"
        style="
          z-index: 0;
          bottom: 250px;
          left: 5vw;
          position: absolute;
          rotate: -30deg;
        "
      />
    </div>
    <script src="script.js"></script>
  </body>
</html>
